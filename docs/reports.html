<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Reports — SmartPark</title>
<meta name="description" content="SmartPark - smart urban parking management.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script>
(function() {
    var saved = 'light';
    try { saved = localStorage.getItem('theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', saved);
})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<main id="main">
<div class="container">
<div class="page-head"><h1>Admin Reports</h1><p>Revenue, demand and utilization across all lots.</p></div>
<div class="stat-grid cols-4" id="kpis"></div>
<div class="chart-grid">
<div class="card"><h3>Revenue per lot</h3><div class="chart-box"><canvas id="chart-revenue"></canvas></div></div>
<div class="card"><h3>Peak hours</h3><div class="chart-box"><canvas id="chart-peak"></canvas></div></div>
<div class="card"><h3>Vehicle type split</h3><div class="chart-box"><canvas id="chart-split"></canvas></div></div>
<div class="card"><h3>Slot utilization</h3><div class="chart-box"><canvas id="chart-util"></canvas></div></div></div>
<h2>Top 5 users by spend</h2>
<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>User</th><th>Bookings</th><th>Total spent</th></tr></thead><tbody id="top-rows"><tr><td colspan="4"><div class="empty">Loading…</div></td></tr></tbody></table></div></div>
</main>
<footer class="footer"><div class="container"><span>© SmartPark</span><span>v1.0.0</span></div></footer>
<div class="toast-wrap" aria-live="polite"></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/reports.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
