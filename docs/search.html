<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Parking — SmartPark</title>
<meta name="description" content="SmartPark - smart urban parking management.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script>
(function() {
    var saved = 'light';
    try { saved = localStorage.getItem('theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', saved);
})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<main id="main">
<div class="container">
<div class="page-head"><h1>Search Parking</h1><p>Find a lot that fits your vehicle and your plans.</p></div>
<form class="card filter-bar" id="search-form">
<div><label for="f-city">City</label><select class="select" id="f-city"></select></div>
<div><label for="f-type">Vehicle type</label><select class="select" id="f-type"><option value="">Any</option><option value="2W">2W</option><option value="4W">4W</option><option value="EV">EV</option></select></div>
<div><label for="f-duration">Duration</label><select class="select" id="f-duration"><option value="1">1 hour</option><option value="2">2 hours</option><option value="3">3 hours</option><option value="4">4 hours</option><option value="6">6 hours</option><option value="8">8 hours</option><option value="12">12 hours</option></select></div>
<div><label>When</label><div class="radio-row"><label><input type="radio" name="when" value="now" id="when-now" checked> Now</label><label><input type="radio" name="when" value="later" id="when-later"> Later</label></div></div>
<button class="btn btn-primary" type="submit"><i data-lucide="search"></i>Search</button></form>
<div class="lot-list" id="results"></div></div>
</main>
<footer class="footer"><div class="container"><span>© SmartPark</span><span>v1.0.0</span></div></footer>
<div class="toast-wrap" aria-live="polite"></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/search.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
